esphome:
  name: living-room-light
  platform: ESP32
  board: nodemcu-32s

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password

api:
  encryption:
    key: !secret api_key

ota:
  password: !secret ota_password

logger:

light:
  - platform: gpio
    pin: GPIO2
    name: "Living Room Light"
