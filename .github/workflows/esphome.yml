name: Build ESPHome Firmware

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:  # Manual trigger

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Setup Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'
        
    - name: Install ESPHome
      run: |
        pip install esphome
        
    - name: Build all device configurations
      run: |
        for config_file in devices/*.yaml; do
          echo "Building $config_file..."
          esphome compile "$config_file" || echo "Failed to build $config_file"
        done
        
    - name: Upload firmware artifacts
      uses: actions/upload-artifact@v4
      with:
        name: esphome-firmwares
        path: build/*.bin
        retention-days: 7
