name: Build ESPHome Firmware

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Setup Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'
        
    - name: Install ESPHome
      run: |
        pip install esphome
        
    - name: Build and collect firmware files
      run: |
        # Create output directory
        mkdir -p firmware-output
        
        # Build each device and copy firmware
        for config_file in devices/*.yaml; do
          if [[ -f "$config_file" ]]; then
            device_name=$(basename "$config_file" .yaml)
            echo "🔨 Building: $device_name"
            
            # Build the firmware
            if esphome compile "$config_file"; then
              echo "✅ Build successful: $device_name"
              
              # Find the generated firmware file
              if compgen -G ".esphome/build/*/.pioenvs/*/firmware.bin" > /dev/null; then
                firmware_path=$(find .esphome/build -name "firmware.bin" | head -1)
                cp "$firmware_path" "firmware-output/${device_name}.bin"
                echo "📦 Firmware copied: firmware-output/${device_name}.bin"
              else
                echo "❌ Firmware file not found for $device_name"
              fi
            else
              echo "❌ Build failed: $device_name"
            fi
            echo "---"
          fi
        done
        
        # List all generated files for debugging
        echo "📁 Contents of firmware-output:"
        ls -la firmware-output/ || echo "No files in firmware-output"
        
    - name: Upload firmware artifacts
      uses: actions/upload-artifact@v4
      with:
        name: esphome-firmwares
        path: firmware-output/
        if-no-files-found: warn
        retention-days: 30
