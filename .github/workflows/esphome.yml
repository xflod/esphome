name: ESPHome Full Debug Build

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Setup Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'
        
    - name: Install ESPHome
      run: |
        pip install esphome
        
    - name: Create a simple test device config
      run: |
        mkdir -p devices
        cat > devices/debug-device.yaml << 'EOF'
        esphome:
          name: "debug-device-01"
          platform: ESP8266
          board: nodemcuv2

        wifi:
          ssid: "TestWiFi"
          password: "test123456"

        logger:

        api:
          encryption:
            key: "aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa"

        ota:
          password: "ota123456"
        EOF
        
        echo "📄 Config file created:"
        cat devices/debug-device.yaml
        
    - name: Build with detailed output
      run: |
        echo "🔨 Building debug-device.yaml..."
        esphome compile --verbose devices/debug-device.yaml
        
    - name: Find all generated files
      run: |
        echo "🔍 Searching for ALL files in the repository..."
        find . -type f | grep -v ".git" | sort | head -50
        
        echo ""
        echo "🔍 Specifically looking for build files..."
        find . -name "*.bin" -type f 2>/dev/null | head -20 || echo "No .bin files found"
        
        echo ""
        echo "🔍 ESPHome build directory structure..."
        find .esphome -type f 2>/dev/null | head -30 || echo "No .esphome directory"
        
        echo ""
        echo "🔍 Current directory contents..."
        ls -la
        echo ""
        ls -la .esphome/ 2>/dev/null || echo "No .esphome directory"
        
    - name: Copy any found firmware files
      run: |
        mkdir -p firmware-collection
        
        # Copy any .bin files found
        if find . -name "*.bin" -type f | head -1; then
          echo "🎯 Found .bin files, copying..."
          find . -name "*.bin" -type f -exec cp {} firmware-collection/ \;
          echo "📦 Files copied to firmware-collection:"
          ls -la firmware-collection/
        else
          echo "❌ No .bin files found anywhere!"
          
          # Check what's actually in .esphome
          echo "📁 Checking .esphome content..."
          find .esphome -type f 2>/dev/null | head -20 || echo "No .esphome files"
        fi
        
    - name: Upload whatever we found
      uses: actions/upload-artifact@v4
      with:
        name: debug-output
        path: |
          firmware-collection/
          devices/debug-device.yaml
        if-no-files-found: warn
