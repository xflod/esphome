name: Build ESPHome Firmware

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:  # Manual trigger

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Build ESPHome firmware
      uses: esphome/esphome-action@v1
      with:
        command: 'compile'
        config: "devices/*.yaml"
        platform: 'esp32'
        
    - name: Upload firmware artifacts
      uses: actions/upload-artifact@v4
      with:
        name: esphome-firmwares
        path: build/*.bin
        retention-days: 7
