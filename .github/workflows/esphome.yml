name: Build ESPHome Firmware

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v3
      
    - name: Build all devices
      uses: esphome/builder-action@v1
      with:
        config: "devices/*.yaml"
        
    - name: Upload firmware artifacts
      uses: actions/upload-artifact@v3
      with:
        name: esphome-firmwares
        path: build/*.bin
        retention-days: 7
